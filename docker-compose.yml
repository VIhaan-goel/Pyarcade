# Run both services locally with Docker:  docker compose up --build
# Website: http://localhost:8080   API: http://localhost:8000
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MAX_SESSIONS: "6"
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    environment:
      BACKEND_URL: http://backend:8000          # frontend server -> API (inside Docker)
      PUBLIC_BACKEND_URL: http://localhost:8000 # visitor's browser -> API (live game video)
    depends_on: [backend]
